      <text x="30" y="4" font-family="sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
      <text x="50" y="4" font-family="sans-serif" font-size="12" font-weight="700" fill="#0284C7">GTR EBIKES Mobilidade Elétrica</text>
