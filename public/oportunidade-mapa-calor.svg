<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" height="100%">
  <defs>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <radialGradient id="heatCore1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#F59E0B" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#10B981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heatCore2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heatCore3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Container -->
  <rect width="900" height="560" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow3)"/>

  <!-- Map Background -->
  <rect x="0" y="0" width="900" height="560" rx="16" fill="#F1F5F9"/>

  <!-- Street Grid & Urban Blocks -->
  <path d="M 0 120 Q 450 180 900 100" fill="none" stroke="#FFFFFF" stroke-width="22"/>
  <path d="M 0 120 Q 450 180 900 100" fill="none" stroke="#CBD5E1" stroke-width="12"/>

  <path d="M 0 340 Q 450 280 900 380" fill="none" stroke="#FFFFFF" stroke-width="20"/>
  <path d="M 0 340 Q 450 280 900 380" fill="none" stroke="#CBD5E1" stroke-width="10"/>

  <path d="M 280 0 L 280 560" fill="none" stroke="#FFFFFF" stroke-width="24"/>
  <path d="M 280 0 L 280 560" fill="none" stroke="#93C5FD" stroke-width="14"/>

  <path d="M 620 0 L 620 560" fill="none" stroke="#FFFFFF" stroke-width="20"/>
  <path d="M 620 0 L 620 560" fill="none" stroke="#CBD5E1" stroke-width="10"/>

  <!-- Water Coast Area -->
  <path d="M 720 0 Q 780 280 900 380 L 900 0 Z" fill="#93C5FD" opacity="0.6"/>

  <!-- Heatmap Density Layers -->
  <!-- Density Node 1: High Competition Zone -->
  <circle cx="280" cy="180" r="180" fill="url(#heatCore1)"/>
  <!-- Density Node 2: Green Opportunity Zone -->
  <circle cx="580" cy="320" r="160" fill="url(#heatCore2)"/>
  <!-- Density Node 3: Emerging Zone -->
  <circle cx="180" cy="380" r="130" fill="url(#heatCore3)"/>

  <!-- Grid Search Nodes with Ranking Numbers -->
  <g transform="translate(280, 180)">
    <circle cx="0" cy="0" r="18" fill="#EF4444" stroke="#FFFFFF" stroke-width="2"/>
    <text x="0" y="5" font-family="sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle">1º</text>
  </g>

  <g transform="translate(360, 220)">
    <circle cx="0" cy="0" r="16" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/>
    <text x="0" y="4" font-family="sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">3º</text>
  </g>

  <g transform="translate(540, 280)">
    <circle cx="0" cy="0" r="18" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
    <text x="0" y="5" font-family="sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle">1º</text>
  </g>

  <g transform="translate(620, 360)">
    <circle cx="0" cy="0" r="16" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
    <text x="0" y="4" font-family="sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">2º</text>
  </g>

  <g transform="translate(180, 380)">
    <circle cx="0" cy="0" r="18" fill="#EF4444" stroke="#FFFFFF" stroke-width="2"/>
    <text x="0" y="5" font-family="sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle">8º</text>
  </g>

  <g transform="translate(420, 420)">
    <circle cx="0" cy="0" r="16" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
    <text x="0" y="4" font-family="sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">5º</text>
  </g>

  <!-- Heatmap Legend Panel (Floating Bottom Left) -->
  <g transform="translate(30, 430)">
    <rect x="0" y="0" width="360" height="100" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow3)"/>
    <text x="20" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#0F172A">LEGENDA DO MAPA DE CALOR</text>
    
    <!-- Legend Bar -->
    <rect x="20" y="40" width="320" height="14" rx="7" fill="url(#heatCore1)"/>
    
    <text x="20" y="75" font-family="sans-serif" font-size="11" font-weight="700" fill="#EF4444">Alta Concentração de Concorrentes</text>
    <text x="340" y="75" font-family="sans-serif" font-size="11" font-weight="700" fill="#10B981" text-anchor="end">Oportunidade Estratégica (Verde)</text>
  </g>

  <!-- Top Right Title Floating Badge -->
  <g transform="translate(560, 30)">
    <rect x="0" y="0" width="310" height="48" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow3)"/>
    <circle cx="28" cy="24" r="8" fill="#10B981"/>
    <text x="46" y="29" font-family="sans-serif" font-size="12" font-weight="800" fill="#0F172A">MAPA DE CALOR DE COBERTURA</text>
  </g>
</svg>
