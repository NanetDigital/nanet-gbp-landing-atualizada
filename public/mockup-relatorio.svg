<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Background Desk Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFBFD"/>
      <stop offset="50%" stop-color="#F1F3F7"/>
      <stop offset="100%" stop-color="#E2E6ED"/>
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.12"/>
      <feDropShadow dx="1" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>

    <filter id="bookletShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="12" dy="24" stdDeviation="28" flood-color="#020617" flood-opacity="0.22"/>
      <feDropShadow dx="2" dy="6" stdDeviation="8" flood-color="#020617" flood-opacity="0.1"/>
    </filter>

    <filter id="pinShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <!-- Heatmap Gradients -->
    <radialGradient id="heatRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heatGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="gaugeArc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Clip Paths for Sheets -->
    <clipPath id="sheetClip">
      <rect x="0" y="0" width="480" height="660" rx="4"/>
    </clipPath>
  </defs>

  <!-- Clean Studio Surface Background -->
  <rect width="1000" height="1000" fill="url(#deskGrad)"/>
  <path d="M0,0 L1000,0 L1000,300 L0,150 Z" fill="#FFFFFF" opacity="0.4"/>

  <!-- ==================== SHEET 1: COMPARAÇÃO DE LOCALIZAÇÕES (TOP LEFT) ==================== -->
  <g transform="translate(260, 230) rotate(-14)" filter="url(#softShadow)">
    <!-- Paper Sheet -->
    <rect x="0" y="0" width="480" height="640" rx="3" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Content Header -->
    <text x="240" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#1E3A8A" text-anchor="middle">Comparação de Localizações</text>
    
    <!-- Table Header -->
    <rect x="25" y="60" width="430" height="24" rx="2" fill="#2563EB"/>
    <text x="40" y="76" font-family="sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Posição</text>
    <text x="100" y="76" font-family="sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Nome da Localização</text>
    <text x="280" y="76" font-family="sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Relevância</text>
    <text x="350" y="76" font-family="sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Avaliações</text>
    <text x="420" y="76" font-family="sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Nota</text>

    <!-- Table Rows -->
    <!-- Row 1 -->
    <rect x="25" y="90" width="430" height="32" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.5"/>
    <circle cx="42" cy="106" r="10" fill="#2563EB"/>
    <text x="42" y="110" font-family="sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="65" y="103" font-family="sans-serif" font-size="10" font-weight="700" fill="#1E293B">Bello - Módulo Auto Móbile</text>
    <text x="65" y="115" font-family="sans-serif" font-size="8" fill="#64748B">C4L1 PSEV Conmoro - Ed. Bairro da E31135G</text>
    <text x="290" y="109" font-family="sans-serif" font-size="10" fill="#334155">3</text>
    <text x="355" y="109" font-family="sans-serif" font-size="10" fill="#334155">87</text>
    <text x="420" y="109" font-family="sans-serif" font-size="10" font-weight="700" fill="#16A34A">4.8</text>

    <!-- Row 2 -->
    <rect x="25" y="128" width="430" height="32" rx="2" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.5"/>
    <circle cx="42" cy="144" r="10" fill="#2563EB"/>
    <text x="42" y="148" font-family="sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="65" y="141" font-family="sans-serif" font-size="10" font-weight="700" fill="#1E293B">Lyo Henrique &amp; Advogados de Guerra</text>
    <text x="65" y="153" font-family="sans-serif" font-size="8" fill="#64748B">Av. Silva Nogueira, 15 - Ed. Torre de Ramos</text>
    <text x="290" y="147" font-family="sans-serif" font-size="10" fill="#334155">4.3</text>
    <text x="355" y="147" font-family="sans-serif" font-size="10" fill="#334155">140</text>
    <text x="420" y="147" font-family="sans-serif" font-size="10" font-weight="700" fill="#16A34A">4.9</text>

    <!-- Row 3 -->
    <rect x="25" y="166" width="430" height="32" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.5"/>
    <circle cx="42" cy="182" r="10" fill="#2563EB"/>
    <text x="42" y="186" font-family="sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="65" y="179" font-family="sans-serif" font-size="10" font-weight="700" fill="#1E293B">Advocacia Integrada - Unidade Central</text>
    <text x="65" y="191" font-family="sans-serif" font-size="8" fill="#64748B">Rua Economista 710</text>
    <text x="290" y="185" font-family="sans-serif" font-size="10" fill="#334155">3.8</text>
    <text x="355" y="185" font-family="sans-serif" font-size="10" fill="#334155">52</text>
    <text x="420" y="185" font-family="sans-serif" font-size="10" font-weight="700" fill="#2563EB">4.5</text>
  </g>

  <!-- ==================== SHEET 2: MAPA DE CALOR (CENTER BACK) ==================== -->
  <g transform="translate(230, 260) rotate(-4)" filter="url(#softShadow)">
    <rect x="0" y="0" width="520" height="660" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    
    <!-- Title -->
    <text x="260" y="45" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#1E3A8A" text-anchor="middle">Mapa de Calor</text>
    <text x="260" y="65" font-family="sans-serif" font-size="10" fill="#64748B" text-anchor="middle">O mapa de densidade de busca local mostra onde sua empresa se destaca</text>

    <!-- Simulated Google Map Layer -->
    <g transform="translate(30, 85)">
      <rect x="0" y="0" width="460" height="520" rx="6" fill="#E5E7EB"/>
      
      <!-- Map Roads / Terrain -->
      <path d="M0,80 Q150,120 300,60 T460,100" fill="none" stroke="#FFFFFF" stroke-width="14"/>
      <path d="M0,80 Q150,120 300,60 T460,100" fill="none" stroke="#CBD5E1" stroke-width="10"/>

      <path d="M120,0 Q180,200 140,520" fill="none" stroke="#FFFFFF" stroke-width="18"/>
      <path d="M120,0 Q180,200 140,520" fill="none" stroke="#93C5FD" stroke-width="12"/>

      <path d="M0,320 Q220,280 460,360" fill="none" stroke="#FFFFFF" stroke-width="12"/>
      <path d="M0,320 Q220,280 460,360" fill="none" stroke="#FDE047" stroke-width="8"/>

      <!-- River / Park -->
      <path d="M280,0 Q340,150 460,220 L460,0 Z" fill="#BFDBFE" opacity="0.6"/>

      <!-- Heatmap Blobs -->
      <circle cx="240" cy="220" r="140" fill="url(#heatRed)"/>
      <circle cx="200" cy="180" r="100" fill="url(#heatRed)"/>
      <circle cx="310" cy="260" r="110" fill="url(#heatGreen)"/>
      <circle cx="140" cy="340" r="90" fill="url(#heatGreen)"/>

      <!-- Map Pin Markers (Blue Pins) -->
      <!-- Pin 1 -->
      <g transform="translate(240, 180)" filter="url(#pinShadow)">
        <path d="M0,0 C-7,-12 -10,-18 -10,-24 C-10,-30 -5,-35 0,-35 C5,-35 10,-30 10,-24 C10,-18 7,-12 0,0 Z" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="0" cy="-24" r="4" fill="#FFFFFF"/>
      </g>
      <!-- Pin 2 -->
      <g transform="translate(200, 220)" filter="url(#pinShadow)">
        <path d="M0,0 C-7,-12 -10,-18 -10,-24 C-10,-30 -5,-35 0,-35 C5,-35 10,-30 10,-24 C10,-18 7,-12 0,0 Z" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="0" cy="-24" r="4" fill="#FFFFFF"/>
      </g>
      <!-- Pin 3 -->
      <g transform="translate(280, 210)" filter="url(#pinShadow)">
        <path d="M0,0 C-7,-12 -10,-18 -10,-24 C-10,-30 -5,-35 0,-35 C5,-35 10,-30 10,-24 C10,-18 7,-12 0,0 Z" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="0" cy="-24" r="4" fill="#FFFFFF"/>
      </g>
      <!-- Pin 4 -->
      <g transform="translate(220, 260)" filter="url(#pinShadow)">
        <path d="M0,0 C-7,-12 -10,-18 -10,-24 C-10,-30 -5,-35 0,-35 C5,-35 10,-30 10,-24 C10,-18 7,-12 0,0 Z" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="0" cy="-24" r="4" fill="#FFFFFF"/>
      </g>
      <!-- Pin 5 -->
      <g transform="translate(300, 270)" filter="url(#pinShadow)">
        <path d="M0,0 C-7,-12 -10,-18 -10,-24 C-10,-30 -5,-35 0,-35 C5,-35 10,-30 10,-24 C10,-18 7,-12 0,0 Z" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="0" cy="-24" r="4" fill="#FFFFFF"/>
      </g>
      <!-- Pin 6 -->
      <g transform="translate(180, 310)" filter="url(#pinShadow)">
        <path d="M0,0 C-7,-12 -10,-18 -10,-24 C-10,-30 -5,-35 0,-35 C5,-35 10,-30 10,-24 C10,-18 7,-12 0,0 Z" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="0" cy="-24" r="4" fill="#FFFFFF"/>
      </g>
      <!-- Pin 7 -->
      <g transform="translate(330, 320)" filter="url(#pinShadow)">
        <path d="M0,0 C-7,-12 -10,-18 -10,-24 C-10,-30 -5,-35 0,-35 C5,-35 10,-30 10,-24 C10,-18 7,-12 0,0 Z" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="0" cy="-24" r="4" fill="#FFFFFF"/>
      </g>
    </g>
  </g>

  <!-- ==================== SHEET 3: ANÁLISE DE BATALHA DE CONCORRÊNCIA (BOTTOM LEFT) ==================== -->
  <g transform="translate(60, 270) rotate(-10)" filter="url(#softShadow)">
    <rect x="0" y="0" width="420" height="580" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    
    <text x="30" y="45" font-family="sans-serif" font-size="13" font-weight="800" fill="#0F172A">Análise de Batalha de Concorrência</text>
    
    <!-- Speedometer Gauge Box -->
    <g transform="translate(30, 65)">
      <rect x="0" y="0" width="360" height="220" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="180" y="30" font-family="sans-serif" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Pontuação Geral</text>

      <!-- Gauge Arc -->
      <path d="M 80 150 A 80 80 0 0 1 280 150" fill="none" stroke="#E2E8F0" stroke-width="18" stroke-linecap="round"/>
      <path d="M 80 150 A 80 80 0 0 1 280 150" fill="none" stroke="url(#gaugeArc)" stroke-width="18" stroke-linecap="round"/>

      <!-- Gauge Needle (pointing to 60 / ~60% angle) -->
      <g transform="translate(180, 150) rotate(20)">
        <polygon points="-4,0 0,-70 4,0" fill="#0F172A"/>
        <circle cx="0" cy="0" r="8" fill="#0F172A"/>
      </g>

      <!-- Value Display Pill -->
      <rect x="130" y="165" width="100" height="36" rx="18" fill="#FFFFFF" stroke="#CBD5E1" filter="url(#pinShadow)"/>
      <text x="180" y="184" font-family="sans-serif" font-size="18" font-weight="900" fill="#0F172A" text-anchor="middle">60</text>
      <text x="180" y="195" font-family="sans-serif" font-size="8" font-weight="700" fill="#16A34A" text-anchor="middle">EXCELENTE</text>
    </g>
  </g>

  <!-- ==================== FOREGROUND MAIN BOOKLET COVER PAGE (RIGHT) ==================== -->
  <g transform="translate(340, 360) rotate(14)" filter="url(#bookletShadow)">
    <!-- Base Booklet Pages Layer Effect (stacked pages effect) -->
    <rect x="-6" y="-3" width="530" height="710" rx="4" fill="#F1F5F9" stroke="#E2E8F0"/>
    <rect x="-3" y="-1.5" width="526" height="706" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>

    <!-- Main Front Cover Booklet -->
    <rect x="0" y="0" width="520" height="700" rx="4" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    
    <!-- Booklet Spine Accent Shadow -->
    <rect x="0" y="0" width="14" height="700" fill="url(#deskGrad)" opacity="0.3"/>
    <line x1="14" y1="0" x2="14" y2="700" stroke="#E5E7EB" stroke-width="1"/>

    <!-- Top Right Confidential Stamp -->
    <g transform="translate(350, 40)">
      <text x="130" y="15" font-family="sans-serif" font-size="10" font-weight="800" fill="#1E293B" text-anchor="end" letter-spacing="1.5">DOCUMENTO</text>
      <text x="130" y="28" font-family="sans-serif" font-size="10" font-weight="800" fill="#1E293B" text-anchor="end" letter-spacing="1.5">CONFIDENCIAL</text>
      <text x="130" y="42" font-family="sans-serif" font-size="8" fill="#64748B" text-anchor="end">Uso exclusivo do cliente</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(50, 220)">
      <text x="0" y="0" font-family="'Times New Roman', Georgia, serif" font-size="44" font-weight="900" fill="#000000" letter-spacing="-0.5">ANÁLISE</text>
      <text x="0" y="48" font-family="'Times New Roman', Georgia, serif" font-size="44" font-weight="900" fill="#000000" letter-spacing="-0.5">ESTRATÉGICA</text>
      <text x="0" y="96" font-family="'Times New Roman', Georgia, serif" font-size="44" font-weight="900" fill="#000000" letter-spacing="-0.5">DA EMPRESA</text>

      <!-- Subtitle Description -->
      <text x="0" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#334155" width="410">
        <tspan x="0" dy="0">Descubra onde sua empresa está perdendo oportunidades,</tspan>
        <tspan x="0" dy="16">como ela se posiciona frente aos concorrentes e quais ações</tspan>
        <tspan x="0" dy="16">devem ser providenciadas para conquistar mais clientes.</tspan>
      </text>

      <!-- Client Details Box -->
      <g transform="translate(0, 200)">
        <rect x="0" y="0" width="420" height="100" rx="8" fill="#F3F4F6" stroke="#E5E7EB"/>
        
        <text x="25" y="32" font-family="sans-serif" font-size="11" font-weight="800" fill="#111827" letter-spacing="0.5">CLIENTE</text>
        <text x="110" y="32" font-family="sans-serif" font-size="12" font-weight="700" fill="#1F2937">Empresa Exemplo LTDA.</text>

        <text x="25" y="58" font-family="sans-serif" font-size="11" font-weight="800" fill="#111827" letter-spacing="0.5">CIDADE</text>
        <text x="110" y="58" font-family="sans-serif" font-size="12" fill="#374151">Vilória • ES</text>

        <text x="25" y="84" font-family="sans-serif" font-size="11" font-weight="800" fill="#111827" letter-spacing="0.5">DATA</text>
        <text x="110" y="84" font-family="sans-serif" font-size="12" fill="#374151">01 de agosto de 2026</text>
      </g>

      <!-- Bottom Logo Footer -->
      <g transform="translate(0, 340)">
        <!-- naNet Brand Logo -->
        <text x="210" y="24" font-family="sans-serif" font-size="32" font-weight="900" fill="#1E3A8A" text-anchor="middle">na<tspan fill="#16A34A">Net</tspan></text>
        <path d="M 120 18 Q 210 -4 300 18" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
        <path d="M 285 10 L 300 18 L 292 3" fill="none" stroke="#16A34A" stroke-width="3" stroke-linecap="round"/>

        <text x="210" y="48" font-family="sans-serif" font-size="11" font-weight="700" fill="#1F2937" text-anchor="middle">Aplicação do Método Algoritmo+</text>
        <text x="210" y="62" font-family="sans-serif" font-size="11" fill="#4B5563" text-anchor="middle">Relatório Executivo</text>
      </g>
    </g>
  </g>
</svg>
